resources:
  jobs:
    rt_demo_job:
      name: realtime-demo
      max_concurrent_runs: 1
      # Run is bounded by the stream task's awaitTermination(timeout) (default
      # 1 h, see base_parameters.run_duration_seconds). `timeout_seconds` here
      # is a job-level safety net in case the stream wedges before timeout.
      timeout_seconds: 4000

      # Both tasks run on the bundle-managed cluster declared in
      # resources/cluster.yml. Reusing one All-Purpose cluster avoids the
      # 3–5 min job-cluster boot per run.

      tasks:
        - task_key: init
          existing_cluster_id: ${resources.clusters.rt_demo_cluster.id}
          notebook_task:
            notebook_path: ../src/notebooks/init.py
            base_parameters:
              project_id: ${var.project_id}
              branch_name: ${var.branch_name}
              database_name: ${var.database_name}
              pg_role: ${var.pg_role}
              pg_password: ${var.pg_password}
              secret_scope: ${var.secret_scope}

        - task_key: stream
          depends_on:
            - task_key: init
          existing_cluster_id: ${resources.clusters.rt_demo_cluster.id}
          notebook_task:
            notebook_path: ../src/notebooks/stream.py
            base_parameters:
              # In `mode: development`, DAB prefixes UC resource names with
              # `dev_<user>_…`; passing the resolved values keeps the notebook
              # decoupled from the naming scheme.
              checkpoint_path: /Volumes/${var.catalog}/${resources.schemas.rt_demo_schema.name}/${resources.volumes.rt_demo_checkpoints.name}/rt_demo
              secret_scope: ${var.secret_scope}
              rows_per_second: "500"
              run_duration_seconds: "3600"
              # Native `format("postgresql")` sink flushes on `batchinterval`
              # elapsed OR `batchsize` rows (default 1000), whichever hits
              # first. Must be a Spark interval string using long-form
              # unit names ("100 milliseconds", not "100" or "100 ms").
              # See stream.py's widget docstring.
              sink_batchinterval: "100 milliseconds"
