resources:
  postgres_projects:
    rt_demo_lakebase:
      project_id: ${var.project_id}
      display_name: Realtime Demo
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 1
        no_suspension: true

  schemas:
    rt_demo_schema:
      catalog_name: ${var.catalog}
      name: realtime_demo
      comment: Realtime app demo — checkpoint volume and supporting UC objects.

  volumes:
    rt_demo_checkpoints:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.rt_demo_schema.name}
      name: checkpoints
      volume_type: MANAGED

  # The secret scope `realtime-demo` and its four placeholder keys are created
  # out-of-band (one-time per workspace) — see the prerequisites section in
  # README.md. They aren't DAB resources because the app's secret bindings
  # need the keys to exist at deploy time.
